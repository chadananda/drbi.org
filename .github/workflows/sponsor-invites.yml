# Sponsor-a-Youth follow-up emails. Split out from the event sync so it keeps a slow
# cadence (the sync now runs every 5 min; these emails must not). Pings the secured endpoint.
# Requires repo secret CRON_SECRET (must match the CRON_SECRET Worker secret).
name: Sponsor-a-youth invites

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours, offset off the hour
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sponsor-invites:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sponsor-a-youth follow-up emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: https://drbi.org/api/cron/sponsor-invites
        run: |
          echo "Triggering $ENDPOINT"
          body=$(curl -fsS -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -w "\n%{http_code}")
          code=$(echo "$body" | tail -n1)
          echo "$body" | sed '$d'
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then exit 1; fi
